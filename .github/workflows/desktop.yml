# Builds the standalone desktop executables on native runners.
#  - Push a tag like v0.1.0 to build all platforms and attach them to a GitHub Release.
#  - Or run it manually from the Actions tab ("Run workflow"). By default this publishes a
#    Release tagged with the desktop app's version (GitHub creates the tag on the commit
#    that was built). Untick "publish" to only build downloadable artifacts.
name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release with the builds'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (leave empty to use the version in desktop/package.json, e.g. v0.1.0)'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install game dependencies
        run: npm ci
      - name: Test the simulation
        run: npm test
      - name: Install desktop tooling
        working-directory: desktop
        run: npm ci
      - name: Build executable
        working-directory: desktop
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: undercrank-${{ runner.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out the release tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME";
          elif [[ -n "${{ inputs.release_tag }}" ]]; then TAG="${{ inputs.release_tag }}";
          else TAG="v$(node -p "require('./desktop/package.json').version")"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing release $TAG"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: The Undercrank ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body: |
            Standalone builds of The Undercrank. No install needed:
            - **Windows**: download the `.exe` and double-click it (click "More info, then Run anyway" on the first launch).
            - **macOS**: open the `.dmg` for your Mac (arm64 = Apple Silicon, x64 = Intel), drag the app to Applications, then right-click and choose Open the first time.
            - **Linux**: download the `.AppImage`, make it executable, and run it.

            Every copy can host online co-op: the Online Co-op menu shows the address friends should type in.
